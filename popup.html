<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebClone AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 400px;
    margin: 0;
    padding: 14px;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    color: #111;
    background: #fafafa;
  }
  h2 {
    margin: 0 0 10px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: -0.2px;
  }
  h2 .badge {
    font-size: 9px;
    background: #111;
    color: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .banner {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .banner.loading { background: #fff4d6; color: #8a5a00; }
  .banner.ok { background: #d9f7e0; color: #0a7d28; }
  .banner.err { background: #ffe0e0; color: #c11; }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  textarea {
    width: 100%;
    height: 320px;
    padding: 10px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    border: 1px solid #ddd;
    border-radius: 8px;
    resize: vertical;
    background: #fff;
    color: #111;
  }
  textarea:focus { outline: none; border-color: #111; }

  .row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  button {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: #fff;
    color: #111;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }
  button:hover { background: #f0f0f0; }
  button.primary { background: #111; color: #fff; border-color: #111; }
  button.primary:hover { background: #333; }

  .meta {
    font-size: 10px;
    color: #888;
    margin-top: 8px;
    text-align: center;
    min-height: 12px;
  }

  .credit {
    text-align: center;
    font-size: 10px;
    color: #999;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #eee;
    letter-spacing: 0.3px;
  }
  .credit b {
    color: #111;
    font-weight: 700;
  }
</style>
</head>
<body>
  <h2>⚡ WebClone AI <span class="badge">v1.0</span></h2>

  <div id="banner" class="banner loading">
    <div class="spinner"></div>
    <span id="bannerText">Reading page...</span>
  </div>

  <textarea id="out" placeholder="Prompt will be here..."></textarea>

  <div class="row">
    <button id="copy" class="primary">📋 Copy Again</button>
    <button id="dl">💾 Save</button>
    <button id="regen">🔄 Regenerate</button>
  </div>

  <div class="meta" id="meta"></div>

  <div class="credit">Developed by <b>Abrar</b></div>

  <script src="popup.js"></script>
</body>
</html>
